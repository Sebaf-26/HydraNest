<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="HydraNest iPhone backups, based on AirVault: wireless iPhone backups to your NAS." />
    <link rel="icon" type="image/svg+xml" href="/hydranest-logo.svg" />
    <title>HydraNest · iPhone</title>
    <!-- Set the theme before first paint to avoid a flash of the wrong one:
         saved choice, then dark like the rest of HydraNest. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('airvault-theme');
          var dark = saved ? saved === 'dark' : true;
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'airvaultdark' : 'airvault'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'airvaultdark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
