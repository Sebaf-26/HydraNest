# HydraNest - Portainer stack (prebuilt images, no local build)
#
# Paste into Portainer -> Stacks -> Add stack (or point a Git stack at this
# file) and set the variables in the "Environment variables" section, e.g.:
#
#   BACKUP_PATH=/TRE_TB/timenest/backups
#   DATA_PATH=/TRE_TB/timenest/data
#   SERVER_NAME=TimeNest
#   DEVICE_MODEL=TimeCapsule8,119
#   ADMIN_USER=admin
#   ADMIN_PASSWORD=<strong password>
#   DEFAULT_QUOTA_GB=1000
#   TIMEZONE=Europe/Rome
#   LOG_LEVEL=INFO
#   ENABLE_METRICS=true
#   SMB_INTERFACES=eth0
#   WEB_PORT=8003
#
# No patched entrypoint needs to be mounted any more: the --log-stdout,
# wildcard include, template and user-persistence problems are fixed in the
# HydraNest images.

services:

  samba:
    image: ghcr.io/sebaf-26/hydranest-samba:latest
    container_name: timenest-samba
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      SERVER_NAME: ${SERVER_NAME:-TimeNest}
      DEVICE_MODEL: ${DEVICE_MODEL:-TimeCapsule8,119}
      SMB_INTERFACES: ${SMB_INTERFACES:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ${BACKUP_PATH:?BACKUP_PATH must be set}:/backup
      - ${DATA_PATH:?DATA_PATH must be set}/samba:/var/lib/samba
      - ${DATA_PATH:?DATA_PATH must be set}/config/shares.d:/etc/timenest/shares.d
    healthcheck:
      test: ["CMD", "pidof", "smbd"]
      interval: 30s
      timeout: 5s
      retries: 3

  avahi:
    image: ghcr.io/sebaf-26/hydranest-avahi:latest
    container_name: timenest-avahi
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      SERVER_NAME: ${SERVER_NAME:-TimeNest}
      DEVICE_MODEL: ${DEVICE_MODEL:-TimeCapsule8,119}
      TZ: ${TIMEZONE:-UTC}
    depends_on:
      - samba

  web:
    image: ghcr.io/sebaf-26/hydranest-web:latest
    container_name: timenest-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8003}:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      BACKUP_PATH: /backup
      DEFAULT_QUOTA_GB: ${DEFAULT_QUOTA_GB:-500}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-UTC}
      SAMBA_CONTAINER: timenest-samba
      SHARES_PATH: /config/shares.d
    volumes:
      - ${BACKUP_PATH:?BACKUP_PATH must be set}:/backup:ro
      - ${DATA_PATH:?DATA_PATH must be set}/web:/data
      - ${DATA_PATH:?DATA_PATH must be set}/samba:/samba:ro
      - ${DATA_PATH:?DATA_PATH must be set}/config:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - samba
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
