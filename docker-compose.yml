# HydraNest stack (fork of TimeNest)
#
# Three services:
#   samba  - Samba 4 with vfs_fruit for Time Machine
#   avahi  - Avahi daemon advertising the share as a Time Capsule
#   web    - FastAPI admin UI + Prometheus metrics
#
# Samba and Avahi need `network_mode: host` so mDNS broadcasts and SMB
# traffic reach the LAN.
#
# Uses the prebuilt images from GHCR, so the same file works with
# `docker compose up -d` (variables from .env) and as a Portainer stack
# (variables in the stack's "Environment variables" section). In Portainer
# use ABSOLUTE paths, e.g.:
#
#   BACKUP_PATH=/TRE_TB/timenest/backups
#   DATA_PATH=/TRE_TB/timenest/data
#   WEB_PORT=8003
#   SMB_INTERFACES=eth0
#   ADMIN_PASSWORD=<strong password>
#
# Persistent state lives under DATA_PATH (default ./data):
#   samba/              passdb.tdb & co. (Samba accounts)
#   config/shares.d/    one <user>.conf per user (shares, also read by the web UI)
#   web/                web UI session data
#
# No patched entrypoint needs to be mounted: the --log-stdout, wildcard
# include, template and user-persistence problems are fixed in the images.

services:

  samba:
    image: ghcr.io/sebaf-26/hydranest-samba:latest
    container_name: timenest-samba
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      SERVER_NAME: ${SERVER_NAME:-TimeNest}
      DEVICE_MODEL: ${DEVICE_MODEL:-TimeCapsule8,119}
      SMB_INTERFACES: ${SMB_INTERFACES:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ${BACKUP_PATH:?BACKUP_PATH must be set}:/backup
      - ${DATA_PATH:-./data}/samba:/var/lib/samba
      # Mount ONLY shares.d: mounting all of /etc/timenest used to hide the
      # image's templates.
      - ${DATA_PATH:-./data}/config/shares.d:/etc/timenest/shares.d
    healthcheck:
      # Anonymous `smbclient -L -N` is refused (restrict anonymous = 2).
      test: ["CMD", "pidof", "smbd"]
      interval: 30s
      timeout: 5s
      retries: 3

  avahi:
    image: ghcr.io/sebaf-26/hydranest-avahi:latest
    container_name: timenest-avahi
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      SERVER_NAME: ${SERVER_NAME:-TimeNest}
      DEVICE_MODEL: ${DEVICE_MODEL:-TimeCapsule8,119}
      TZ: ${TIMEZONE:-UTC}
    depends_on:
      - samba

  web:
    image: ghcr.io/sebaf-26/hydranest-web:latest
    container_name: timenest-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      BACKUP_PATH: /backup
      DEFAULT_QUOTA_GB: ${DEFAULT_QUOTA_GB:-500}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-UTC}
      SAMBA_CONTAINER: timenest-samba
      SHARES_PATH: /config/shares.d
    volumes:
      - ${BACKUP_PATH:?BACKUP_PATH must be set}:/backup:ro
      - ${DATA_PATH:-./data}/web:/data
      - ${DATA_PATH:-./data}/samba:/samba:ro
      # Same directory the samba container writes shares.d into, so the
      # "Configured users" list is not empty.
      - ${DATA_PATH:-./data}/config:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - samba
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
